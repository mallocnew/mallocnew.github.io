<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Speech to Text</title>
    <meta name="theme-color" content="#0b1018" />
    <meta name="description" content="Non-streaming speech to text. Drop audio or video, or record, then get the full transcript." />
    <link rel="canonical" href="/" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      :root {
        --bg: #0b1018;
        --bg-2: #111826;
        --panel: #151c28;
        --line: #2a3448;
        --text: #e8edf7;
        --muted: #8b97ad;
        --accent: #3d8bfd;
        --danger: #e5484d;
        --ok: #3ecf8e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      button, input, label { touch-action: manipulation; }
      body {
        margin: 0;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          linear-gradient(180deg, #0e1522 0%, var(--bg) 28%),
          var(--bg);
        padding-bottom: env(safe-area-inset-bottom);
      }
      a { color: inherit; text-decoration: none; }
      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .bar {
        border-bottom: 1px solid var(--line);
        background: rgba(17, 24, 38, 0.92);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .bar-inner {
        width: min(1180px, calc(100% - 2rem));
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 0;
        padding-top: max(0.85rem, env(safe-area-inset-top));
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .mark {
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--accent), #6aa6ff);
        display: grid;
        place-items: center;
        color: #061018;
        font-size: 0.72rem;
        font-weight: 800;
      }
      .bar-right {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .chip {
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.28rem 0.55rem;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .lang {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .lang button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
      }
      .lang button.is-on {
        background: #1c2740;
        color: var(--text);
      }
      .workspace {
        width: min(1180px, calc(100% - 1.25rem));
        margin: 1rem auto 2.5rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        align-items: start;
      }
      @media (max-width: 1024px) {
        .workspace { grid-template-columns: 1fr; }
        .chip { display: none; }
      }
      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 10px;
        overflow: hidden;
      }
      .panel-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.7rem 0.9rem;
        border-bottom: 1px solid var(--line);
        background: #121a28;
      }
      .panel-h h2 {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .panel-b { padding: 0.9rem; }
      .models {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.4rem;
      }
      .models button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--bg-2);
        color: var(--muted);
        border-radius: 6px;
        min-height: 44px;
        padding: 0.55rem 0.35rem;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 650;
        cursor: pointer;
      }
      .models button.is-on {
        color: var(--text);
        border-color: var(--accent);
        background: #173057;
      }
      .model-hint {
        margin: 0.65rem 0 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.5;
      }
      .model-hint + .model-hint { margin-top: 0.25rem; min-height: 0; }
      @media (max-width: 560px) {
        .models { grid-template-columns: repeat(2, 1fr); }
      }
      .drop {
        margin-top: 0.85rem;
        min-height: 132px;
        border: 1px dashed #3a4863;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1rem;
        cursor: pointer;
        background: #101722;
      }
      .drop:hover, .drop.is-over {
        border-color: var(--accent);
        background: #142033;
      }
      .drop input { display: none; }
      .drop h3 {
        margin: 0 0 0.3rem;
        font-size: 0.98rem;
      }
      .drop p { margin: 0; color: var(--muted); font-size: 0.82rem; }
      .media {
        display: none;
        margin-top: 0.85rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #101722;
        padding: 0.75rem;
      }
      .media.is-on { display: grid; gap: 0.65rem; }
      .media-meta {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .media-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font-weight: 600;
      }
      .media-el { display: none; width: 100%; }
      .media-el.is-on { display: block; }
      video.media-el.is-on {
        width: 100%;
        max-height: min(42vh, 380px);
        object-fit: contain;
        background: #000;
        border-radius: 6px;
        cursor: pointer;
      }
      .transport {
        display: grid;
        grid-template-columns: 48px 1fr auto;
        gap: 0.55rem;
        align-items: center;
      }
      .play {
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #071018;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .play:disabled { opacity: 0.4; }
      .seek {
        width: 100%;
        accent-color: var(--accent);
        height: 28px;
      }
      .clock {
        min-width: 5.6rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.85rem;
      }
      .btn {
        flex: 1;
        appearance: none;
        border: 1px solid transparent;
        border-radius: 6px;
        min-height: 48px;
        padding: 0.68rem 0.85rem;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 650;
        cursor: pointer;
        color: #071018;
        background: var(--accent);
      }
      .btn.ghost {
        color: var(--text);
        background: transparent;
        border-color: var(--line);
      }
      .btn.live {
        background: var(--danger);
        color: #fff;
      }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      label.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.75rem;
        margin-top: 0.85rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }
      .status {
        flex: 1;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.45;
      }
      .status.is-error { color: var(--danger); }
      .status.is-ok { color: var(--ok); }
      textarea {
        width: 100%;
        min-height: 280px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.85rem 0.9rem;
        background: #101722;
        color: var(--text);
        font: inherit;
        line-height: 1.7;
      }
      textarea:focus { outline: 1px solid var(--accent); }
      .segments {
        margin: 0.75rem 0 0;
        padding: 0;
        display: grid;
        gap: 0.4rem;
        max-height: 320px;
        overflow: auto;
      }
      .segments li {
        padding: 0.65rem 0.7rem;
        border-radius: 6px;
        background: #101722;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .segments li:hover { border-color: var(--line); }
      .seg-time {
        display: block;
        color: var(--accent);
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
        margin-bottom: 0.18rem;
      }
      .seg-spk {
        display: inline-block;
        margin-right: 0.4rem;
        color: var(--ok);
      }
      .seg-text { color: #d7deec; font-size: 0.92rem; }
      @media (max-width: 1024px) {
        .media.is-on {
          position: sticky;
          bottom: 0;
          z-index: 12;
          margin-bottom: 0;
          box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.35);
        }
        textarea { min-height: 180px; }
        .segments { max-height: 40vh; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="bar-inner">
        <a class="brand" href="/">
          <span class="mark">ASR</span>
          <span data-i18n="brand">Speech to Text</span>
        </a>
        <div class="bar-right">
          <span class="chip" data-i18n="badge">Batch · non-streaming</span>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
        </div>
      </header>

      <main class="workspace" data-asr>
        <section class="panel">
          <div class="panel-h"><h2 data-i18n="source">Source</h2></div>
          <div class="panel-b">
            <div class="models" role="tablist">
              <button type="button" data-asr-model="general" data-i18n="modelGeneral">General</button>
              <button type="button" data-asr-model="ultra" data-i18n="modelUltra">Ultra</button>
              <button type="button" data-asr-model="gsr" data-i18n="modelGsr">Polish</button>
              <button type="button" data-asr-model="diarize" data-i18n="modelDiarize">Speakers</button>
            </div>
            <p class="model-hint" data-asr-hint></p>
            <p class="model-hint" data-i18n="reuseHint">Switch models to transcribe the same media again.</p>
            <label class="drop" data-asr-drop for="asr-file">
              <input id="asr-file" type="file" accept="audio/*,video/*,.mp4,.mov,.m4v,.webm,.mkv,.avi,.mpeg,.3gp" data-asr-file />
              <div>
                <h3 data-i18n="dropTitle">Drop audio or video</h3>
                <p data-i18n="dropHint">Tap to choose. mp3 / wav / m4a / mp4 and other media, up to 50MB.</p>
              </div>
            </label>
            <div class="media" data-asr-media>
              <div class="media-meta">
                <span class="media-name" data-asr-filechip></span>
                <span data-asr-filesize></span>
              </div>
              <audio class="media-el" data-asr-player playsinline webkit-playsinline preload="metadata"></audio>
              <video class="media-el" data-asr-video playsinline webkit-playsinline preload="metadata"></video>
              <div class="transport">
                <button type="button" class="play" data-asr-play data-i18n="play" disabled>Play</button>
                <input class="seek" type="range" min="0" max="0" step="0.1" value="0" data-asr-seek disabled />
                <span class="clock" data-asr-clock>00:00 / 00:00</span>
              </div>
              <div class="row" style="margin-top:0">
                <button type="button" class="btn ghost" data-asr-download data-i18n="download" disabled>Download</button>
              </div>
            </div>
            <div class="row">
              <label class="btn ghost" for="asr-file" data-i18n="chooseFile">Choose file</label>
              <button type="button" class="btn" data-asr-record data-i18n="record">Start recording</button>
            </div>
            <div class="row">
              <button type="button" class="btn ghost" data-asr-copy data-i18n="copy">Copy text</button>
            </div>
            <div class="status-bar">
              <span class="status" data-asr-status data-i18n="idle">Waiting for media</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-h"><h2 data-i18n="result">Transcript</h2></div>
          <div class="panel-b">
            <textarea data-asr-text data-i18n-placeholder="placeholder" placeholder="Full text will appear here"></textarea>
            <ol class="segments" data-asr-segments hidden></ol>
          </div>
        </section>
      </main>
    </div>
    <script src="/asr.js"></script>
  </body>
</html>
